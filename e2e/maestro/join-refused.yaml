# After a restart the app is on the start screen; joining the running game again must show an error.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: home_join
    timeout: 30000
- tapOn:
    id: home_join
- scrollUntilVisible:
    element:
      id: banner_error
    direction: DOWN
    timeout: 30000
