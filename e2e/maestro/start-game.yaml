# The host makes SEEKER_ID the seeker and starts the round.
appId: ${APP_ID}
---
- scrollUntilVisible:
    element:
      id: seeker_switch_${SEEKER_ID}
    direction: DOWN
    timeout: 30000
# On iOS a row hidden under the «Start» bar still counts as visible, and a tap there lands on the bar: scroll on to the
# end of the list (the last row ends above the bar), then back up if the row went above the screen.
- scroll
- scrollUntilVisible:
    element:
      id: seeker_switch_${SEEKER_ID}
    direction: UP
    timeout: 30000
- tapOn:
    id: seeker_switch_${SEEKER_ID}
- scrollUntilVisible:
    element:
      id: lobby_start
    direction: DOWN
- tapOn:
    id: lobby_start
- extendedWaitUntil:
    visible:
      id: phase_hiding
    timeout: 30000
