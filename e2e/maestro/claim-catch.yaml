# The seeker presses "Found" next to HIDER_ID and gets the code form.
appId: ${APP_ID}
---
- scrollUntilVisible:
    element:
      id: claim_${HIDER_ID}
    direction: DOWN
    timeout: 30000
- tapOn:
    id: claim_${HIDER_ID}
# The code form takes the place of the list of hiders once the server has the claim. With the chat button above the
# panel, its field can start below the fold of a small screen.
- extendedWaitUntil:
    notVisible:
      id: claim_${HIDER_ID}
    timeout: 15000
- scrollUntilVisible:
    element:
      id: code_input
    direction: DOWN
    timeout: 15000
