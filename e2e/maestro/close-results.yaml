# The player closes the results screen and lands on UNTIL: the «Play» tab (home_screen) when logged in, the welcome
# screen (welcome_screen) as a guest. Scrolls along the left edge, in the screen's padding: the replay's map takes
# pinches and drags, a swipe that starts on it would move the map, not the screen.
appId: ${APP_ID}
---
- repeat:
    while:
      notVisible:
        id: results_back
    times: 12
    commands:
      - swipe:
          start: 3%, 75%
          end: 3%, 35%
          duration: 500
- tapOn:
    id: results_back
- extendedWaitUntil:
    visible:
      id: ${UNTIL}
    timeout: 30000
