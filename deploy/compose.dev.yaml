# PostgreSQL for local development, matching the server's defaults (jdbc:postgresql://localhost:5432/hovanki, user and
# password `hovanki`): `docker compose -f deploy/compose.dev.yaml up -d`, then `./gradlew :server:bootRun`.
# Listens on localhost only. Stop: `... down`; also delete the data: `... down -v`. Production: compose.yaml.
name: hovanki-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hovanki
      POSTGRES_USER: hovanki
      POSTGRES_PASSWORD: hovanki
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=hovanki", "--dbname=hovanki"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-dev-data:
