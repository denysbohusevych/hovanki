# Hovanki server on one VM: the game server behind Caddy, which gets and renews the Let's Encrypt certificate. The
# database (accounts, friends, groups; games stay in the server's memory) is Amazon RDS for PostgreSQL in the same
# region, reached over TLS with its certificate checked against the RDS certificate bundle `rds-ca.pem` next to this
# file (aws-user-data.sh downloads it).
# Settings come from `.env` next to this file: DOMAIN, HOVANKI_TAG (default `main`, updated by hovanki-update.timer
# after every push to main), DATABASE_HOST and DATABASE_PASSWORD, and the SMTP account for emails (SPRING_MAIL_HOST,
# SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, HOVANKI_MAIL_FROM). Setup and updates: docs/deploy.md.
# One replica only: games live in memory, so a restart ends the games in progress.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  server:
    image: ghcr.io/denysbohusevych/hovanki-server:${HOVANKI_TAG:-main}
    restart: unless-stopped
    environment:
      # verify-full: TLS, and the certificate must be the RDS instance's (issued by an RDS CA, for this host name).
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${DATABASE_HOST:?set DATABASE_HOST in .env}:5432/hovanki?sslmode=verify-full&sslrootcert=/etc/hovanki/rds-ca.pem"
      SPRING_DATASOURCE_USERNAME: hovanki
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      # Real emails (verification and password reset codes); the server refuses to start without host and sender.
      HOVANKI_MAIL_SENDER: smtp
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?set SPRING_MAIL_HOST in .env}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      HOVANKI_MAIL_FROM: ${HOVANKI_MAIL_FROM:?set HOVANKI_MAIL_FROM in .env}
    volumes:
      # Missing file: `docker compose` stops with an error instead of creating an empty directory in its place.
      - type: bind
        source: ./rds-ca.pem
        target: /etc/hovanki/rds-ca.pem
        read_only: true
        bind:
          create_host_path: false
    # The heap is 75% of this limit (JAVA_TOOL_OPTIONS in server/Dockerfile); leaves room for Caddy on a 1 GB VM.
    mem_limit: 640m
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # No access log (off by default for this command); the server port stays inside the compose network.
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN in .env} --to server:8080
    volumes:
      - caddy-data:/data
    logging: *logging

volumes:
  # Certificates and the ACME account; kept across restarts to stay within Let's Encrypt rate limits.
  caddy-data:
