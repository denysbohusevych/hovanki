# Hovanki server on one VM: the game server behind Caddy, which gets and renews the Let's Encrypt certificate, and
# PostgreSQL for accounts, friends and groups (games themselves stay in the server's memory).
# Settings come from `.env` next to this file: DOMAIN, HOVANKI_TAG (default `main`, updated by hovanki-update.timer
# after every push to main), POSTGRES_PASSWORD, and the SMTP account for emails (SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, HOVANKI_MAIL_FROM). Setup, updates and backups: docs/deploy.md.
# One replica only: games live in memory, so a restart ends the games in progress.
# Memory of a 1 GB VM (plus 1 GB swap): server 560m, Postgres 192m, the rest for Caddy and the OS.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  server:
    image: ghcr.io/denysbohusevych/hovanki-server:${HOVANKI_TAG:-main}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hovanki
      SPRING_DATASOURCE_USERNAME: hovanki
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Real emails (verification and password reset codes); the server refuses to start without host and sender.
      HOVANKI_MAIL_SENDER: smtp
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?set SPRING_MAIL_HOST in .env}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      HOVANKI_MAIL_FROM: ${HOVANKI_MAIL_FROM:?set HOVANKI_MAIL_FROM in .env}
    # The heap is 75% of this limit (JAVA_TOOL_OPTIONS in server/Dockerfile); leaves room for Postgres and Caddy.
    mem_limit: 560m
    logging: *logging

  postgres:
    # Major version pinned: moving to the next one needs a dump and restore (docs/deploy.md).
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hovanki
      POSTGRES_USER: hovanki
      # Used only when the data volume is created; changing it later needs ALTER ROLE (docs/deploy.md).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Sized for the 192m limit: the server's pool has 5 connections, the rest is for psql and pg_dump.
    command: postgres -c shared_buffers=32MB -c max_connections=20 -c work_mem=4MB
    mem_limit: 192m
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Over TCP: the image's temporary server during the first initialization listens only on the Unix socket, so the
    # server waits for the real one. No published port: only the compose network reaches the database.
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=hovanki", "--dbname=hovanki"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # No access log (off by default for this command); the server port stays inside the compose network.
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN in .env} --to server:8080
    volumes:
      - caddy-data:/data
    logging: *logging

volumes:
  # Certificates and the ACME account; kept across restarts to stay within Let's Encrypt rate limits.
  caddy-data:
  # The database; backed up daily by hovanki-backup.timer into /opt/hovanki/backups.
  postgres-data:
