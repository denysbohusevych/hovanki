# Hovanki server on one VM: the game server answers the internet itself, TLS included (the profile `tls`,
# application-tls.yaml), with the Let's Encrypt certificate that lego gets and renews over DuckDNS (hovanki-cert.sh,
# hovanki-cert.timer) in /etc/hovanki/tls. Caddy in front is the way back, under the profile `caddy` below
# (docs/deploy.md, «Без Caddy»). The database (accounts, friends, groups; games stay in the server's memory) is Amazon
# RDS for PostgreSQL in the same region, reached over TLS with its certificate checked against the RDS certificate
# bundle `rds-ca.pem` next to this file (aws-user-data.sh downloads it).
# Settings come from `.env` next to this file: DOMAIN, HOVANKI_TAG (default `main`, updated by hovanki-update.timer
# after every push to main), DATABASE_HOST and DATABASE_PASSWORD, and the SMTP account for emails (SPRING_MAIL_HOST,
# SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, HOVANKI_MAIL_FROM). Setup and updates: docs/deploy.md.
# The same file runs the staging server of the field test (ADR 0018): its own VM, its own `.env`
# (.env.staging.example) with SPRING_PROFILES_ACTIVE=staging, the database `hovanki_staging` with its own role
# (DATABASE_NAME, DATABASE_USER), the staging name in DOMAIN and a bigger memory limit (SERVER_MEM_LIMIT). Without those
# variables nothing changes for the production VM. On the field test's days the production VM itself sets
# SPRING_PROFILES_ACTIVE=field (the field log, 60 players; docs/deploy.md, «Полевой тест на основном сервере»).
# One replica only: games live in memory, so a restart ends the games in progress.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  server:
    image: ghcr.io/denysbohusevych/hovanki-server:${HOVANKI_TAG:-main}
    restart: unless-stopped
    environment:
      # verify-full: TLS, and the certificate must be the RDS instance's (issued by an RDS CA, for this host name).
      # The database and its role are `hovanki` here; staging has its own on the same RDS (DATABASE_NAME, DATABASE_USER).
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${DATABASE_HOST:?set DATABASE_HOST in .env}:5432/${DATABASE_NAME:-hovanki}?sslmode=verify-full&sslrootcert=/etc/hovanki/rds-ca.pem"
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER:-hovanki}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      # Real emails (verification and password reset codes); the server refuses to start without host and sender.
      HOVANKI_MAIL_SENDER: smtp
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?set SPRING_MAIL_HOST in .env}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      HOVANKI_MAIL_FROM: ${HOVANKI_MAIL_FROM:?set HOVANKI_MAIL_FROM in .env}
      # The admin (docs/adr/0008-admin.md): off while empty. Spring reads it as hovanki.admin.secret-key.
      HOVANKI_ADMIN_SECRETKEY: ${HOVANKI_ADMIN_SECRET_KEY:-}
      # `field` on the production VM on the field test's days (application-field.yaml); `staging` on the staging server
      # (application-staging.yaml, and application-field.yaml with it). Empty is the same as unset.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # Staging only: Sentry of the server (ADR 0018, §7); empty: no Sentry. Never set on production.
      SENTRY_DSN: ${SENTRY_DSN:-}
      # The server's own TLS on 8443 (application-tls.yaml), next to the profiles above. HOVANKI_TLS= (empty) in .env
      # puts it back on plain HTTP 8080 behind Caddy (the way back, docs/deploy.md).
      SPRING_PROFILES_INCLUDE: ${HOVANKI_TLS-tls}
    ports:
      # The phones and the admin straight to the server: HTTPS, and UDP for the live channel v2 (docs/live-v2/server.md).
      # Docker keeps the phone's address as the source. Behind Caddy: HOVANKI_PUBLISH=127.0.0.1:8443 in .env.
      - "${HOVANKI_PUBLISH:-443}:8443/tcp"
      - "${HOVANKI_PUBLISH:-443}:8443/udp"
    volumes:
      # Missing file: `docker compose` stops with an error instead of creating an empty directory in its place.
      - type: bind
        source: ./rds-ca.pem
        target: /etc/hovanki/rds-ca.pem
        read_only: true
        bind:
          create_host_path: false
      # The certificate and its key (fullchain.pem, privkey.pem), kept by hovanki-cert-deploy.sh; the server reads them
      # again when they change.
      - type: bind
        source: /etc/hovanki/tls
        target: /etc/hovanki/tls
        read_only: true
        bind:
          create_host_path: false
    # The heap is 55% of this limit (JAVA_TOOL_OPTIONS in server/Dockerfile); 640m leaves room for the OS and Caddy on
    # a 1 GB VM. Without Caddy it may grow, after a measurement (docs/live-v2/server.md §2.4).
    # Staging has more RAM: SERVER_MEM_LIMIT=1g on a t3.small, 2g on a t3.medium on the day of a test.
    mem_limit: ${SERVER_MEM_LIMIT:-640m}
    logging: *logging

  # The way back to Caddy in front (docs/deploy.md, «Без Caddy»): COMPOSE_PROFILES=caddy, HOVANKI_TLS= and
  # HOVANKI_PUBLISH=127.0.0.1:8443 in .env. Its volume keeps its certificates meanwhile.
  caddy:
    image: caddy:2
    profiles: [caddy]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # No access log (off by default for this command); the server port stays inside the compose network.
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN in .env} --to server:8080
    volumes:
      - caddy-data:/data
    logging: *logging

volumes:
  # Certificates and the ACME account; kept across restarts to stay within Let's Encrypt rate limits.
  caddy-data:
