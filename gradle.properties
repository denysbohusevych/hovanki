# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
# iOS targets can only be built on macOS; don't warn about them on Linux/Windows.
kotlin.native.ignoreDisabledTargets=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# App
# Default game server of non-debug builds (preview, TestFlight, release), https only; debug builds use the
# development machine. Unset: players type the address on the start screen (docs/ci-cd.md).
#hovanki.serverUrl=https://hovanki.example.org
