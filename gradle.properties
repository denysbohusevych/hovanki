# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
# iOS targets can only be built on macOS; don't warn about them on Linux/Windows.
kotlin.native.ignoreDisabledTargets=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# App
# The game server (preview, TestFlight, release, and a debug build on a real phone), https only and required: the app
# has no address field. Debug builds on an emulator or a simulator use the development machine (docs/ci-cd.md). The
# server runs on one EC2 VM, see docs/deploy.md.
hovanki.serverUrl=https://hovanki.duckdns.org
