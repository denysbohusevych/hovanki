spring:
  application:
    name: hovanki-server
  # Accounts, friends, groups and reports live in PostgreSQL (docs/adr/0004-accounts-friends-chat.md); games stay in
  # memory. Local development: deploy/compose.dev.yaml. Production sets SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD.
  datasource:
    url: jdbc:postgresql://localhost:5432/hovanki
    username: hovanki
    password: hovanki
    hikari:
      maximum-pool-size: 5
  # Migrations in db/migration (classpath), applied at startup; only ever appended.
  flyway:
    enabled: true
  # SMTP for hovanki.mail.sender=smtp: production sets SPRING_MAIL_HOST, _PORT, _USERNAME, _PASSWORD.
  mail:
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Behind Caddy: the client's address from X-Forwarded-For (rate limits per IP), only from a proxy on a private
  # network.
  forward-headers-strategy: native
  # The buildings of a zone can be hundreds of KB of JSON; OkHttp and NSURLSession unpack gzip themselves.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

management:
  endpoints:
    web:
      exposure:
        # restarthold: deploy/hovanki-update.sh waits while a big game is on (RestartHoldEndpoint).
        include: health,info,restarthold
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Would open an SMTP connection on every health check, and a slow mail provider would mark the server down.
    mail:
      enabled: false

hovanki:
  accounts:
    bcrypt-strength: 10
    # Emailed codes (6 digits): lifetime and wrong entries per code.
    code-ttl: 15m
    code-max-attempts: 5
    # Logged-in devices unused for this long are logged out.
    session-idle-retention: 180d
    # Unanswered friend requests.
    request-retention: 90d
  moderation:
    report-retention: 90d
  # Game history (docs/adr/0007-game-history-and-routes.md): saved routes of the players who turned it on. Results
  # and statistics stay until the account is deleted.
  history:
    route-retention: 90d
  # DataRetention: deletes what the retention periods above allow, once a day (server time is UTC).
  retention:
    cron: "0 17 3 * * *"
  mail:
    # log (local development: codes in the console, DEV ONLY), smtp (production: HOVANKI_MAIL_SENDER=smtp, with
    # HOVANKI_MAIL_FROM and SPRING_MAIL_*; the server does not start without them), recording (tests, e2e profile).
    sender: log
  # Per client IP (behind the proxy, see forward-headers-strategy), account, login or email address.
  rate-limits:
    enabled: true
    login-per-login: { count: 10, window: 15m }
    login-per-ip: { count: 30, window: 15m }
    register-per-ip: { count: 20, window: 1h }
    email-per-minute: { count: 1, window: 1m }
    email-per-hour: { count: 5, window: 1h }
    password-reset-per-email: { count: 3, window: 1h }
    password-reset-per-ip: { count: 10, window: 1h }
    friend-requests: { count: 30, window: 1h }
    invites: { count: 30, window: 1h }
    reports: { count: 10, window: 1h }
    admin-totp: { count: 10, window: 15m }
  # Staff admin, the /admin page (docs/adr/0008-admin.md). Off without a secret key: HOVANKI_ADMIN_SECRET_KEY in .env
  # (deploy/compose.yaml passes it on), base64 of 32 random bytes (openssl rand -base64 32); it encrypts the staff's
  # authenticator secrets.
  admin:
    secret-key: ""
    session-idle: 30m
    session-max: 8h
    challenge-ttl: 5m
    challenge-max-attempts: 5
    # The audit log, and bans and chat bans after they ended.
    audit-retention: 365d
  games:
    # Game data (all positions, chat) is kept in memory only and deleted after the game (GDPR); only what the history
    # keeps (docs/adr/0007-game-history-and-routes.md) is saved when the game ends.
    finished-retention: 30m
    idle-retention: 6h
    cleanup-interval: 1m
  # The "no hiding in buildings" rule (docs/adr/0003-map-and-buildings.md): the building layer of the players' map
  # tiles (tiles), or OpenStreetMap through Overpass (overpass: the public instances refuse servers in AWS), fake, off.
  buildings:
    source: tiles
    overpass-urls:
      - https://overpass-api.de/api/interpreter
      - https://overpass.kumi.systems/api/interpreter
  # The vector tiles of the players' map (OpenFreeMap): buildings, and the streets of the zone by streets
  # (docs/adr/0009-game-setup-glow-streets.md; streets: tiles, fake or off).
  map:
    tiles-url: https://tiles.openfreemap.org/planet
    streets: tiles
    # The ground under the zone (houses, water, woods, parks, fields) for how many players it fits: tiles, fake, off.
    terrain: tiles
  # Square meters one player needs, by kind of ground (docs/adr/0010-big-games.md): the lobby warns the host of a crowded
  # zone. Starting values, to be corrected after the first games outdoors; an admin sets a big game's own.
  capacity:
    dense-square-meters: 1000
    forest-square-meters: 1500
    mixed-square-meters: 2500
    open-square-meters: 10000
  # Big games (docs/adr/0010-big-games.md): the lobby opens this long before the start; the scheduler looks every tick;
  # fewer than two players an hour after the start cancel it; deleted with the sign-ups 90 days after the end.
  big-games:
    lobby-opens-before: 30m
    tick: 10s
    start-patience: 1h
    retention: 90d
