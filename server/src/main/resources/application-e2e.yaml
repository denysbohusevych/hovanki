# Profile for end-to-end tests (:e2e, e2e/run-devices.sh): enables the observer endpoints /api/v1/debug/...
# (DebugController) that expose every player's position and every emailed code. Never enable it in production.
hovanki:
  # Emails stay in memory; the tests read the codes from /api/v1/debug/emails/{email}.
  mail:
    sender: recording
  # Many bots register and log in from one address.
  rate-limits:
    enabled: false
  accounts:
    # Fast password hashing: bots register and log in all the time.
    bcrypt-strength: 4
  games:
    # Tests create many short games; keep finished ones around a little for the report, then free the memory.
    finished-retention: 10m
  # The fixed test quarter next to every zone center (DebugBuildings): no external service in tests.
  buildings:
    source: fake
  # The fixed street grid around every zone center (DebugStreets) for the zone by streets; built-up ground everywhere
  # for the zone's capacity (one player per 1 000 m²).
  map:
    streets: fake
    terrain: fake
  # The admin is on for the e2e tests (AdminTest); a key for this profile only, never for production.
  admin:
    secret-key: "khhmZ2aNOlQzfjpPJ9CnfdZt5I6Rysi5J2fFKitQL5M="
  # Big games: lobbies open and rounds start within a second of their time.
  big-games:
    tick: 1s
  # The bots keep the field log of their games (FieldLogTest): an e2e server may have it, like the test server.
  field:
    allowed: true
