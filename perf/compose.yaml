# The server's performance lab (docs/perf.md), on this machine only: its own PostgreSQL with pg_stat_statements,
# Prometheus and Grafana with the lab's dashboard. Every port listens on localhost only.
#   perf/up.sh                 the database and the monitoring; the server runs on the host (perf/server.sh, the IDE)
#   perf/up.sh --container     plus the server in a container with production's limits (the `container` profile below)
#   perf/down.sh [--wipe]      stops everything; --wipe also deletes the database and the metrics
# Development's PostgreSQL (deploy/compose.dev.yaml) keeps 5432; the lab's is on 5433, a database of its own.
name: hovanki-perf

services:
  postgres:
    # PostgreSQL 17 like production's RDS db.t4g.micro: 2 vCPU and 1 GB, off the server's CPUs (it is another
    # machine there), a quarter of its memory for the shared buffers as RDS sets it.
    image: postgres:17-alpine
    restart: unless-stopped
    cpuset: ${PERF_DB_CPUSET:-2,3}
    mem_limit: 1g
    # Every statement's count and time (perf/pg-top.sh reads them), and the time spent waiting for the disk.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - shared_buffers=256MB
    environment:
      POSTGRES_DB: hovanki
      POSTGRES_USER: hovanki
      POSTGRES_PASSWORD: hovanki
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=hovanki", "--dbname=hovanki"]
      interval: 5s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.7.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=14d
    ports:
      - "127.0.0.1:9090:9090"
    # The server on the host (perf/server.sh) is host.docker.internal; Docker Desktop has the name, Linux needs this.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      # One person on their own machine: no login, everybody is the admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hovanki.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # The server as on production: the same image (server/Dockerfile, on the JDK for jcmd and the profiler) with the
  # production VM's limits. `./gradlew :server:bootJar` first; perf/up.sh --container does both.
  server:
    profiles: [container]
    build:
      context: ../server
      args:
        BASE_IMAGE: eclipse-temurin:21-jdk
    image: hovanki-server:perf
    restart: "no"
    # Production: one t3.micro, its 2 vCPU (one core's two threads) for the server, Caddy and the system together, and
    # mem_limit 640m in deploy/compose.yaml; the heap is 55 % of it (Dockerfile). The server and Caddy share the same
    # two CPUs here, the database and Gatling (perf/run.sh) stay off them.
    cpuset: ${PERF_CPUSET:-0,1}
    mem_limit: ${PERF_SERVER_MEM:-640m}
    environment:
      SPRING_PROFILES_ACTIVE: e2e,perf
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hovanki
      # Tomcat's default, as production. perf/run.sh --lift raises it to check that the generator reaches a level.
      SERVER_TOMCAT_MAX_CONNECTIONS: ${PERF_MAX_CONNECTIONS:-8192}
      # The Dockerfile's heap share (PERF_HEAP_PERCENT), collector (PERF_GC: G1, Serial, Parallel, Shenandoah, Z) and pause
      # goal (PERF_GC_PAUSE_MS; Parallel heeds it too), plus PERF_SERVER_JAVA_OPTS for one run (e.g.
      # -XX:NativeMemoryTracking=summary). Two collectors at once stop the JVM.
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=${PERF_HEAP_PERCENT:-55} -XX:+Use${PERF_GC:-G1}GC
        -XX:MaxGCPauseMillis=${PERF_GC_PAUSE_MS:-20} ${PERF_SERVER_JAVA_OPTS:-}
      # glibc's malloc arenas (one per thread by default, up to 8 per CPU): PERF_MALLOC_ARENA_MAX caps them for a run.
      MALLOC_ARENA_MAX: ${PERF_MALLOC_ARENA_MAX:-0}
      # The map: the e2e profile's fake buildings, streets and ground, or with PERF_MAP=tiles the real ones of the tiles
      # perf/tiles.py records and replays on this machine (docs/perf.md, «Настоящие здания»).
      HOVANKI_BUILDINGS_SOURCE: ${PERF_MAP:-fake}
      HOVANKI_MAP_STREETS: ${PERF_MAP:-fake}
      HOVANKI_MAP_TERRAIN: ${PERF_MAP:-fake}
      HOVANKI_MAP_TILES_URL: ${PERF_TILES_URL:-http://host.docker.internal:8090/planet}
    # This machine, where perf/tiles.py runs (Docker Desktop has the name already, Linux needs it).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    # perf/up.sh --container returns once the server answers.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      postgres:
        condition: service_healthy

  # Production's TLS in front of the server (perf/Caddyfile), on the server's CPUs and in what a 1 GB machine leaves
  # it: 1 GB minus the server's 640 MB and the system's ~130 MB.
  caddy:
    profiles: [container]
    image: caddy:2.10.2
    restart: "no"
    cpuset: ${PERF_CPUSET:-0,1}
    mem_limit: ${PERF_CADDY_MEM:-250m}
    ports:
      - "127.0.0.1:8443-8446:8443-8446"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      server:
        condition: service_healthy

  # Gatling inside the lab's network (perf/gatling.sh), for runs of more connections than this machine's own network
  # stack takes: macOS gives one address and port about 16 000 ephemeral ports, and Docker Desktop's port forwarding
  # carries every connection through a process of its own. Here the players reach the server (http://server:8080) or
  # Caddy (https://caddy:8443) straight, with all 64 000 ports of their own namespace. On its own CPUs, off the
  # server's and the database's; the code is the host's (the repository and the Gradle cache at the same paths).
  gatling:
    profiles: [load]
    image: eclipse-temurin:21-jdk
    restart: "no"
    cpuset: ${PERF_GATLING_CPUSET:-4-9}
    mem_limit: ${PERF_GATLING_MEM:-4g}
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
    ulimits:
      nofile: ${PERF_GATLING_NOFILE:-1048576}
    working_dir: ${PERF_REPO:-/repo}
    volumes:
      - ${PERF_REPO:-.}:${PERF_REPO:-/repo}
      - ${PERF_GRADLE_HOME:-~/.gradle}:${PERF_GRADLE_HOME:-/gradle}:ro

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
