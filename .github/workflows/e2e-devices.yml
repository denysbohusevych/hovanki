name: E2E devices

# Slow e2e layer (docs/e2e.md): the debug app on Android emulators and iOS simulators, mixed with headless bots,
# against the server with the e2e profile; Maestro drives the UI. Nightly and on demand; the fast bot layer
# (./gradlew :e2e:test) runs in ci.yml on every push.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario
        type: choice
        options: [all, full-round, restart]
        default: all
      bots:
        description: Headless bots per game
        default: "3"
  schedule:
    # Nightly, off the full hour when GitHub's scheduler is busiest.
    - cron: "17 2 * * *"

concurrency:
  group: e2e-devices-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCENARIO: ${{ inputs.scenario || 'all' }}
  BOTS: ${{ inputs.bots || '3' }}
  MAESTRO_CLI_NO_ANALYTICS: "1"
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
  # The version the device layer was verified with; the installer reads it.
  MAESTRO_VERSION: 2.10.0

jobs:
  android:
    name: Android emulators
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      # Hardware acceleration for the emulators. reactivecircus/android-emulator-runner runs a single emulator,
      # e2e/run-devices.sh starts two itself.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the emulator system image
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: android-system-image-34-google_apis-x86_64

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Two emulators, bots, scenarios
        run: e2e/run-devices.sh --android 2 --bots "$BOTS" --scenario "$SCENARIO"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-devices-android
          path: e2e/build/reports/devices/
          if-no-files-found: ignore
          retention-days: 14

  ios:
    name: iOS simulator
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # One simulator: the macOS runner (3 cores, 7 GB) needs ~17 min to boot a second one and then slows down every
      # step. Several simulators are for a local Mac: e2e/run-devices.sh --ios 2.
      - name: A simulator, bots, scenarios
        run: e2e/run-devices.sh --ios 1 --bots "$BOTS" --scenario "$SCENARIO"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-devices-ios
          path: e2e/build/reports/devices/
          if-no-files-found: ignore
          retention-days: 14
