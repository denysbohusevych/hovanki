name: Preview

# Tester builds of main (docs/ci-cd.md, «Как поставить сборку на телефон»): a signed Android APK on the floating
# pre-release `preview` and an iOS build in TestFlight. Build number = run number on both platforms. Without the
# signing secrets the jobs still build (unsigned), skip publishing and list in the log what to add.
on:
  push:
    branches: [main, claude/focused-knuth-s0d5tu]  # TEMPORARY: verify on this branch, remove before merge
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  # A newer push replaces the build anyway.
  cancel-in-progress: true

permissions: {}

env:
  BUILD_NUMBER: ${{ github.run_number }}
  # Only main publishes; a manual run on another branch just builds.
  PUBLISH: ${{ github.ref == 'refs/heads/main' }}

jobs:
  android:
    name: Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      version: ${{ steps.apk.outputs.version }}
      subject: ${{ steps.apk.outputs.subject }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      # Same keystore as release.yml: every preview installs over the previous one. The Gradle build signs only
      # when the ANDROID_* variables below are set.
      - name: Decode signing keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if ((${#missing[@]})); then
            echo "::warning title=Android preview is not signed::Missing repository secrets: ${missing[*]}. The APK is built unsigned and not published. How to create them: docs/ci-cd.md, section «Секреты для подписи Android»."
            {
              echo "### Android: preview not published"
              echo "An unsigned APK cannot be installed, so nothing was published. Add these repository secrets"
              echo "(Settings → Secrets and variables → Actions), see docs/ci-cd.md, «Секреты для подписи Android»:"
              for name in "${missing[@]}"; do echo "- \`$name\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build preview APK
        run: ./gradlew :androidApp:assemblePreview -Phovanki.versionCode="$BUILD_NUMBER"

      - name: Collect the APK
        id: apk
        run: |
          dir=androidApp/build/outputs/apk/preview
          version="$(jq -r '.elements[0].versionName' "$dir/output-metadata.json")"
          mkdir -p dist
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp "$dir/androidApp-preview.apk" dist/hovanki-preview.apk
          else
            cp "$dir/androidApp-preview-unsigned.apk" dist/hovanki-preview-unsigned.apk
          fi
          ls -l dist
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: android-preview
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  # A floating pre-release: one tag `preview` that moves to the newest build, one stable download URL. Recreated on
  # every run, so its date changes; Obtainium can track it by release date (docs/ci-cd.md).
  android-release:
    name: Android pre-release
    needs: android
    if: needs.android.outputs.signed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-preview
          path: dist

      - name: Replace the preview pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.android.outputs.version }}
          SUBJECT: ${{ needs.android.outputs.subject }}
        run: |
          server="$GITHUB_SERVER_URL/$GH_REPO"
          cat > notes.md <<EOF
          Tester build of \`main\`, replaced by every push. How to install and update: docs/ci-cd.md, «Как поставить сборку на телефон».

          | | |
          |---|---|
          | Version | $VERSION (versionCode $BUILD_NUMBER) |
          | Commit | [\`${GITHUB_SHA::7}\`]($server/commit/$GITHUB_SHA) $SUBJECT |
          | Build | [run $BUILD_NUMBER]($server/actions/runs/$GITHUB_RUN_ID) |

          Application id \`app.hovanki.preview\` ("Hovanki β"): installs next to a store release. The start screen shows the same version and commit at the bottom.

          Direct link to the newest APK: $server/releases/download/preview/hovanki-preview.apk
          EOF
          gh release delete preview --yes --cleanup-tag || true
          # A tag left without its release would pin the new release to an old commit.
          gh api --method DELETE "repos/$GH_REPO/git/refs/tags/preview" 2>/dev/null || true
          gh release create preview dist/hovanki-preview.apk \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Preview $VERSION ($BUILD_NUMBER)" --notes-file notes.md

  ios:
    name: iOS TestFlight
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Check the signing secrets
        id: signing
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          missing=()
          for name in IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64 APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_KEY_BASE64; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if ((${#missing[@]})); then
            echo "::notice title=TestFlight upload skipped::Missing repository secrets: ${missing[*]}. The app is built unsigned and checked, nothing is uploaded. Setup: docs/ci-cd.md, section «iOS: TestFlight»."
            {
              echo "### iOS: TestFlight upload skipped"
              echo "The Release build was archived without signing and checked; nothing was uploaded. Add these"
              echo "repository secrets (Settings → Secrets and variables → Actions), see docs/ci-cd.md, «iOS: TestFlight»:"
              for name in "${missing[@]}"; do echo "- \`$name\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      # Manual signing: an Apple Distribution certificate in a temporary keychain and an App Store provisioning
      # profile for the app's bundle id. The Team ID comes from the profile.
      - name: Install certificate and provisioning profile
        if: steps.signing.outputs.signed == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          # Add to the search list, keeping the login keychain (paths without spaces).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/distribution.p12"

          profile="$RUNNER_TEMP/distribution.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          field() { plutil -extract "$1" raw -o - "$RUNNER_TEMP/profile.plist"; }
          uuid="$(field UUID)"
          name="$(field Name)"
          team="$(field TeamIdentifier.0)"
          app_id="$(field Entitlements.application-identifier)"
          if plutil -extract ProvisionedDevices xml1 -o - "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            echo "::error::Profile '$name' lists devices: it is a Development or Ad Hoc profile, TestFlight needs an App Store Connect profile."
            exit 1
          fi
          bundle_id="$(xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Release -showBuildSettings \
            | awk -F ' = ' '$1 ~ /^ *PRODUCT_BUNDLE_IDENTIFIER$/ { print $2; exit }')"
          if [ "$app_id" != "$team.$bundle_id" ]; then
            echo "::error::Profile '$name' is for $app_id, the app is $team.$bundle_id (BUNDLE_ID in iosApp/Configuration/Config.xcconfig)."
            exit 1
          fi
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.mobileprovision"
          done
          echo "Signing $bundle_id with profile '$name' of team $team"
          {
            echo "KEYCHAIN=$keychain"
            echo "TEAM_ID=$team"
            echo "BUNDLE_ID=$bundle_id"
            echo "PROFILE_UUID=$uuid"
            echo "PROFILE_NAME=$name"
          } >> "$GITHUB_ENV"

      # Release configuration: release Kotlin framework (no LaunchOptions), no ATS exceptions (debug-info-plist.sh
      # adds them to Debug builds only).
      - name: Archive the Release build
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            signing=(CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=Apple Distribution" "DEVELOPMENT_TEAM=$TEAM_ID"
              "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME" "OTHER_CODE_SIGN_FLAGS=--keychain $KEYCHAIN")
          else
            signing=(CODE_SIGNING_ALLOWED=NO)
          fi
          xcodebuild archive -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Hovanki.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" "${signing[@]}"

      - name: Check the app
        run: |
          app="$RUNNER_TEMP/Hovanki.xcarchive/Products/Applications/Hovanki.app"
          plist="$app/Info.plist"
          value() { plutil -extract "$1" raw -o - "$plist"; }
          echo "Bundle: $(value CFBundleIdentifier) $(value CFBundleShortVersionString) ($(value CFBundleVersion))"
          fail=0
          [ "$(value CFBundleVersion)" = "$BUILD_NUMBER" ] || { echo "::error::CFBundleVersion is not the run number"; fail=1; }
          for key in NSAppTransportSecurity NSLocalNetworkUsageDescription; do
            if plutil -extract "$key" xml1 -o - "$plist" >/dev/null 2>&1; then
              echo "::error::$key is in the Release Info.plist: development exceptions must not ship"; fail=1
            fi
          done
          [ -f "$app/PrivacyInfo.xcprivacy" ] || { echo "::error::PrivacyInfo.xcprivacy is missing"; fail=1; }
          for lang in en ru uk; do
            strings="$app/$lang.lproj/InfoPlist.strings"
            if [ -f "$strings" ]; then
              echo "$lang: $(plutil -extract NSLocationWhenInUseUsageDescription raw -o - "$strings")"
            else
              echo "::error::$lang.lproj/InfoPlist.strings is missing (localized permission texts)"; fail=1
            fi
          done
          ls "$app"
          exit $fail

      - name: Upload to TestFlight
        if: steps.signing.outputs.signed == 'true' && env.PUBLISH == 'true'
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          echo "$KEY_BASE64" | base64 --decode > "$key"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_UUID</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Hovanki.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$key" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          {
            echo "### iOS: build $BUILD_NUMBER uploaded to TestFlight"
            echo "App Store Connect processes it for 5–30 minutes, then internal testers get it in the TestFlight app."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          [ -z "${KEYCHAIN:-}" ] || security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/distribution.mobileprovision" "$RUNNER_TEMP/profile.plist"
          [ -z "${PROFILE_UUID:-}" ] || rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
