name: Preview

# Tester builds of main, the field test build (docs/ci-cd.md, «Как поставить сборку на телефон», ADR 0018): a signed
# Android APK on the floating pre-release `preview`, the same build as an AAB on the internal track of Google Play
# (app.hovanki.preview) and an iOS build in TestFlight. They talk to the staging server (the repository variable
# STAGING_SERVER_URL, docs/deploy.md), never to production: so the TestFlight build of this workflow must not go to the
# App Store, the App Store build is the one of release.yml. Without STAGING_SERVER_URL the builds are made and checked
# but published nowhere: a tester build with the field log and Sentry must never reach testers talking to production.
# Build number = run number on both platforms. Without the signing and upload secrets the jobs still build (unsigned),
# skip publishing and list in the log what to add.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  # A newer push replaces the build anyway.
  cancel-in-progress: true

permissions: {}

# Only main publishes (the pre-release, Google Play, TestFlight); a manual run on another branch just builds.
env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  android:
    name: Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      # true: the build talks to the staging server, so it may be published.
      staging: ${{ steps.server.outputs.staging }}
      version: ${{ steps.apk.outputs.version }}
      subject: ${{ steps.apk.outputs.subject }}
      server: ${{ steps.apk.outputs.server }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      # Same keystore as release.yml: every preview installs over the previous one. The Gradle build signs only
      # when the ANDROID_* variables below are set.
      - name: Decode signing keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if ((${#missing[@]})); then
            echo "::warning title=Android preview is not signed::Missing repository secrets: ${missing[*]}. The APK is built unsigned and not published. How to create them: docs/ci-cd.md, section «Секреты для подписи Android»."
            {
              echo "### Android: preview not published"
              echo "An unsigned APK cannot be installed, so nothing was published. Add these repository secrets"
              echo "(Settings → Secrets and variables → Actions), see docs/ci-cd.md, «Секреты для подписи Android»:"
              for name in "${missing[@]}"; do echo "- \`$name\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # The tester build talks to the staging server: its address is the repository variable STAGING_SERVER_URL
      # (docs/ci-cd.md, «Переменные и секреты»). Without it the build keeps the production address of
      # gradle.properties, says so loudly and is not published (the jobs android-release and android-play skip).
      - name: Server address
        id: server
        env:
          STAGING_SERVER_URL: ${{ vars.STAGING_SERVER_URL }}
        run: |
          production="$(sed -n 's/^hovanki\.serverUrl=//p' gradle.properties | tr -d '[:space:]')"
          production="${production%/}"
          # The build trims spaces and a trailing slash of the address; so does the check of the APK below. A pasted
          # variable with a newline in it would also break the lines written to GITHUB_ENV.
          staging="$(printf '%s' "$STAGING_SERVER_URL" | tr -d '[:space:]')"
          staging="${staging%/}"
          if [ -n "$staging" ]; then
            case "$staging" in
              https://?*) ;;
              *)
                echo "::error title=STAGING_SERVER_URL is not an https address::The repository variable must be like https://hovanki-staging.duckdns.org (the app talks HTTPS only), got '$staging'. See docs/ci-cd.md, «Переменные и секреты»."
                exit 1
                ;;
            esac
            {
              echo "SERVER_URL=$staging"
              echo "STAGING_URL=$staging"
              echo "FORBIDDEN_SERVER_URL=$production"
            } >> "$GITHUB_ENV"
            echo "staging=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Android preview build"
              echo "Server: $staging"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "SERVER_URL=$production"
              echo "FORBIDDEN_SERVER_URL="
            } >> "$GITHUB_ENV"
            echo "staging=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Preview not published::The repository variable STAGING_SERVER_URL is not set, so the tester build would talk to production: it is built and checked, and published nowhere (no pre-release, no Google Play). Setup: docs/ci-cd.md, «Переменные и секреты»."
            {
              echo "### Android preview build not published: no staging server"
              echo "The repository variable \`STAGING_SERVER_URL\` is not set (Settings → Secrets and variables → Actions → Variables)."
              echo "The build keeps \`hovanki.serverUrl\` of \`gradle.properties\` ($production), so it is only built and checked:"
              echo "no pre-release and no Google Play upload. See docs/ci-cd.md, «Переменные и секреты»."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The APK for the pre-release and the AAB for Google Play come from one Gradle run (R8 runs once). The channel
      # tells the app it is the tester build; an empty Sentry DSN (no secret yet) means no Sentry.
      - name: Build preview APK and AAB
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          props=("-Phovanki.versionCode=$BUILD_NUMBER" "-Phovanki.channel=preview" "-Phovanki.sentryDsn=$SENTRY_DSN")
          # STAGING_URL is set by the step «Server address» (checked and trimmed) only when the variable is set:
          # otherwise the address of gradle.properties stays.
          if [ -n "${STAGING_URL:-}" ]; then props+=("-Phovanki.serverUrl=$STAGING_URL"); fi
          ./gradlew :androidApp:assemblePreview :androidApp:bundlePreview "${props[@]}"

      - name: Collect the APK and the AAB
        id: apk
        run: |
          dir=androidApp/build/outputs/apk/preview
          version="$(jq -r '.elements[0].versionName' "$dir/output-metadata.json")"
          mkdir -p dist dist-aab
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp "$dir/androidApp-preview.apk" dist/hovanki-preview.apk
            # Google Play takes only a signed bundle: the upload key is the keystore of the secrets.
            cp androidApp/build/outputs/bundle/preview/androidApp-preview.aab dist-aab/hovanki-preview.aab
          else
            cp "$dir/androidApp-preview-unsigned.apk" dist/hovanki-preview-unsigned.apk
          fi
          ls -l dist dist-aab
          {
            echo "version=$version"
            echo "subject=$(git log -1 --format=%s)"
            echo "server=$SERVER_URL"
          } >> "$GITHUB_OUTPUT"

      # A tester build is the release build: no debug flag, no cleartext traffic, no automation deep link.
      - name: Check the APK
        run: |
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)"
          apk="$(ls dist/*.apk)"
          badging="$("$aapt2" dump badging "$apk")"
          manifest="$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")"
          grep -E "^(package|application-label):" <<<"$badging"
          fail=0
          if ! grep -q "^package: name='app.hovanki.preview' versionCode='$BUILD_NUMBER'" <<<"$badging"; then
            echo "::error::Unexpected package name or versionCode"; fail=1
          fi
          if grep -q "^application-debuggable" <<<"$badging"; then
            echo "::error::The preview APK is debuggable"; fail=1
          fi
          if grep -q "usesCleartextTraffic.*=true" <<<"$manifest"; then
            echo "::error::The preview APK allows cleartext HTTP"; fail=1
          fi
          if grep -q '"hovanki"' <<<"$manifest"; then
            echo "::error::The preview APK has the debug deep link hovanki://"; fail=1
          fi
          # The address baked in is the one the build was asked for, not the production one by mistake. Strings of the
          # dex files are plain UTF-8.
          dex="$(unzip -p "$apk" 'classes*.dex' | LC_ALL=C grep -a -c -F "$SERVER_URL" || true)"
          if [ "$dex" = 0 ]; then
            echo "::error::The preview APK does not contain the server address $SERVER_URL"; fail=1
          elif [ -n "$FORBIDDEN_SERVER_URL" ] && unzip -p "$apk" 'classes*.dex' | LC_ALL=C grep -a -q -F "$FORBIDDEN_SERVER_URL"; then
            echo "::error::The preview APK contains the production address $FORBIDDEN_SERVER_URL"; fail=1
          else
            echo "The APK talks to $SERVER_URL"
          fi
          if [ -d dist-aab ] && [ -n "$(ls dist-aab)" ]; then
            aab="$(ls dist-aab/*.aab)"
            unzip -l "$aab" | grep -q 'base/manifest/AndroidManifest.xml' || { echo "::error::The AAB has no base manifest"; fail=1; }
            unzip -p "$aab" base/manifest/AndroidManifest.xml | LC_ALL=C grep -a -q 'app.hovanki.preview' ||
              { echo "::error::The AAB is not app.hovanki.preview"; fail=1; }
          fi
          exit $fail

      - uses: actions/upload-artifact@v7
        with:
          name: android-preview
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.signed == 'true'
        with:
          name: android-preview-aab
          path: dist-aab/
          if-no-files-found: error
          retention-days: 14

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  # A floating pre-release: one tag `preview` that moves to the newest build, one stable download URL. Recreated on
  # every run, so its date changes; Obtainium can track it by release date (docs/ci-cd.md).
  android-release:
    name: Android pre-release
    needs: android
    if: >-
      needs.android.outputs.signed == 'true' && needs.android.outputs.staging == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-preview
          path: dist

      - name: Replace the preview pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.android.outputs.version }}
          SUBJECT: ${{ needs.android.outputs.subject }}
          GAME_SERVER: ${{ needs.android.outputs.server }}
        run: |
          server="$GITHUB_SERVER_URL/$GH_REPO"
          cat > notes.md <<EOF
          Tester build of \`main\`, replaced by every push. How to install and update: docs/ci-cd.md, «Как поставить сборку на телефон».

          | | |
          |---|---|
          | Version | $VERSION (versionCode $BUILD_NUMBER) |
          | Commit | [\`${GITHUB_SHA::7}\`]($server/commit/$GITHUB_SHA) $SUBJECT |
          | Build | [run $BUILD_NUMBER]($server/actions/runs/$GITHUB_RUN_ID) |
          | Game server | $GAME_SERVER |

          Application id \`app.hovanki.preview\` ("Hovanki β"): installs next to a store release. The start screen shows the same version and commit at the bottom. The game server is the staging one: its accounts and games are separate from production.

          Direct link to the newest APK: $server/releases/download/preview/hovanki-preview.apk
          EOF
          gh release delete preview --yes --cleanup-tag || true
          # A tag left without its release would pin the new release to an old commit.
          gh api --method DELETE "repos/$GH_REPO/git/refs/tags/preview" 2>/dev/null || true
          gh release create preview dist/hovanki-preview.apk \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Preview $VERSION ($BUILD_NUMBER)" --notes-file notes.md

  # Google Play internal testing (docs/ci-cd.md, «Google Play: внутреннее тестирование»): the second way to the same
  # tester build, with updates by themselves and no GitHub account for the tester. A separate app in Play Console,
  # `app.hovanki.preview`; the track `internal` takes up to 100 testers and needs no review. Only from main, only the
  # signed AAB of a build that talks to staging, only with the service account secret: without it the job says what to
  # add and stays green.
  android-play:
    name: Google Play internal
    needs: android
    if: >-
      needs.android.outputs.signed == 'true' && needs.android.outputs.staging == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Nothing from the repository is read: the bundle comes as an artifact of this run.
    permissions: {}
    steps:
      - name: Check the service account
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice title=Google Play upload skipped::Missing repository secret PLAY_SERVICE_ACCOUNT_JSON. The AAB is built and not uploaded. Setup: docs/ci-cd.md, section «Google Play: внутреннее тестирование»."
            {
              echo "### Google Play: upload skipped"
              echo "The AAB was built and checked; nothing was uploaded. Add the repository secret"
              echo "(Settings → Secrets and variables → Actions), see docs/ci-cd.md, «Google Play: внутреннее тестирование»:"
              echo "- \`PLAY_SERVICE_ACCOUNT_JSON\`: the whole JSON key of the service account, as text"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A wrong value (base64 instead of the JSON text, a half-copied file) would otherwise fail inside the upload
          # action with a message about credentials. The key itself never reaches the log.
          if ! jq -e '.type == "service_account" and (.client_email | length > 0) and (.private_key | length > 0)' \
            <<<"$PLAY_SERVICE_ACCOUNT_JSON" >/dev/null 2>&1; then
            echo "::error title=PLAY_SERVICE_ACCOUNT_JSON is not a service account key::The secret must hold the JSON file of the key as text (not base64). See docs/ci-cd.md, «Google Play: внутреннее тестирование»."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        if: steps.play.outputs.configured == 'true'
        with:
          name: android-preview-aab
          path: dist

      # `completed` publishes the build to the internal testers at once. Play refuses it for an app that has not had
      # a first release yet («Only releases with status draft may be created on draft app»): the repository variable
      # PLAY_RELEASE_STATUS=draft makes the build a draft to roll out by hand in Play Console, until the first
      # manual release is done (docs/ci-cd.md). A third-party action that gets the service account's key: pinned to a
      # commit, never a tag that can be moved; updated on purpose, after reading the change (docs/ci-cd.md).
      - name: Upload to the internal track
        if: steps.play.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.hovanki.preview
          releaseFiles: dist/hovanki-preview.aab
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          releaseName: ${{ needs.android.outputs.version }} (${{ github.run_number }})

      - name: Summary
        if: steps.play.outputs.configured == 'true'
        env:
          VERSION: ${{ needs.android.outputs.version }}
          STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
        run: |
          {
            echo "### Google Play: build $BUILD_NUMBER ($VERSION) uploaded to the internal track"
            if [ "$STATUS" = completed ]; then
              echo "Testers get the update from the Play Store within minutes."
            else
              echo "The release is a $STATUS: roll it out in Play Console → Testing → Internal testing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The tester build of iOS: archive, checks, TestFlight. The steps are shared with the App Store build of release.yml
  # (ios-testflight.yml); this one talks to staging, so it never goes to the App Store.
  ios:
    name: iOS TestFlight
    permissions:
      contents: read
    uses: ./.github/workflows/ios-testflight.yml
    with:
      channel: preview
      server-url: ${{ vars.STAGING_SERVER_URL }}
      # Only main publishes, and only a build that talks to staging; a manual run on another branch just builds.
      # ios-testflight.yml refuses a preview without a server address too.
      publish: ${{ github.ref == 'refs/heads/main' && vars.STAGING_SERVER_URL != '' }}
    secrets:
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      # The Live Activity's widget extension (app.hovanki.ios.live), once its target is in the project.
      IOS_LIVE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_LIVE_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
