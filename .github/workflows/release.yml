name: Release

# Builds a signed Android release (APK + AAB), the iOS App Store build (uploaded to TestFlight, from where it is
# submitted for review) and the server Docker image. The app builds talk to the production server (hovanki.serverUrl of
# gradle.properties); the tester builds of preview.yml talk to staging and never go to the App Store.
# A `v*` tag push also creates a GitHub Release. See docs/ci-cd.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release halfway (e.g. after the image is pushed but before the GitHub Release exists).
  cancel-in-progress: false

permissions: {}

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Compute version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The Gradle build signs the release only when these env vars are present.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, the release build will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK and AAB
        run: >
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease
          -Phovanki.versionName="$VERSION"
          -Phovanki.versionCode=${{ github.run_number }}
          -Phovanki.channel=release

      - name: Collect outputs
        run: |
          mkdir -p dist
          for file in androidApp/build/outputs/apk/release/*.apk androidApp/build/outputs/bundle/release/*.aab; do
            name="$(basename "$file")"
            cp "$file" "dist/${name/androidApp/hovanki-$VERSION}"
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: dist/
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  # The App Store build: the production server, the version of the tag, TestFlight. It is the only iOS build that may
  # be submitted for review. Its build number is above every tester build of preview.yml (docs/ci-cd.md,
  # «Номера сборок»). A manual run builds and checks without uploading. It does not block the GitHub Release: if
  # Apple is down, re-run only this job.
  ios:
    name: iOS App Store build
    permissions:
      contents: read
    uses: ./.github/workflows/ios-testflight.yml
    with:
      channel: release
      # The staging server must not be in this build.
      forbidden-url: ${{ vars.STAGING_SERVER_URL }}
      build-number-offset: 100000
      version-from-tag: true
      publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    # No Sentry DSN here: the App Store build has no Sentry.
    secrets:
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      # The Live Activity's widget extension (app.hovanki.ios.live), once its target is in the project.
      IOS_LIVE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_LIVE_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}

  server-image:
    name: Server image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/server-image.yml
    with:
      # v1.2.3 -> 1.2.3, 1.2 and latest (not for pre-releases like v1.2.3-rc.1); every build also gets sha-<short>.
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha

  github-release:
    name: GitHub Release
    needs: [android, server-image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-release
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.apk
            dist/*.aab
          generate_release_notes: true
          # Tags like v1.0.0-rc.1 become pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Server image: `${{ needs.server-image.outputs.image }}:${{ needs.server-image.outputs.version }}`
